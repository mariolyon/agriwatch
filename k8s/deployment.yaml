apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agriwatch
  template:
    metadata:
      labels:
        app: agriwatch
    spec:
      containers:
        - name: agriwatch
          image: ghcr.io/mariolyon/agriwatch:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3000'
            - name: PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agriwatch-env
                  key: PUBLIC_SUPABASE_URL
            - name: PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: agriwatch-env
                  key: PUBLIC_SUPABASE_ANON_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agriwatch-env
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-login
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: agriwatch
  labels:
    app: agriwatch
spec:
  type: ClusterIP
  selector:
    app: agriwatch
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
    - host: agriwatch.digileo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agriwatch
                port:
                  number: 80
  tls:
    - hosts:
        - agriwatch.digileo.com
      secretName: agriwatch-cert
