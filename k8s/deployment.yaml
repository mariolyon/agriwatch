apiVersion: apps/v1
kind: Deployment
metadata:
  name: climview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: climview
  template:
    metadata:
      labels:
        app: climview
    spec:
      containers:
        - name: climview
          image: ghcr.io/mariolyon/climview:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3000'
            - name: PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: climview-env
                  key: PUBLIC_SUPABASE_URL
            - name: PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: climview-env
                  key: PUBLIC_SUPABASE_ANON_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: climview-env
                  key: DATABASE_URL
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: climview-env
                  key: DIRECT_DATABASE_URL
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: climview-env
                  key: WEATHER_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      imagePullSecrets:
        - name: ghcr-login
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: climview
  labels:
    app: climview
spec:
  type: ClusterIP
  selector:
    app: climview
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: climview-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
    - host: climview.digileo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: climview
                port:
                  number: 80
  tls:
    - hosts:
        - climview.digileo.com
      secretName: climview-cert
